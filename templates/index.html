<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生成工作台</title>
<link rel="stylesheet" href="/static/style.css?v=20260829b">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="logo">⚡ 生成工作台</div>
    <div class="top-right">
      <button class="btn-ghost" id="luxBtn">✨ 豪横预设</button>
      <button class="btn-ghost" id="importBtn">📥 导入模型</button>
      <button class="btn-ghost" id="favBtn">⭐ 收藏 (<span id="favCount">0</span>)</button>
      <div class="conn" id="conn">连接中...</div>
    </div>
  </header>

  <main class="layout">
    <div class="tabbar" id="tabbar">
      <button class="tab active" data-page="gen">⚙ 生成</button>
      <button class="tab" data-page="imgs">🖼 图片</button>
    </div>

    <aside class="panel page-gen active">
      <section class="card">
        <h3>模型</h3>
        <label>Checkpoint <select id="ckpt"></select></label>
        <label>LoRA</label>
        <div id="loraList"></div>
        <button class="btn-ghost" id="addLora">+ 添加 LoRA</button>
        <label>VAE <select id="vae"></select></label>
        <label>CLIP Skip
          <input id="clipSkip" type="number" min="1" max="4" value="1">
        </label>
      </section>

      <section class="card">
        <h3>img2img 参考图</h3>
        <label class="checkline">
          <input type="checkbox" id="i2iOn">
          <span>使用参考图重绘（img2img）</span>
        </label>
        <input type="file" id="refFile" accept="image/*" style="width:100%">
        <div style="margin-top:6px;display:flex;gap:8px;align-items:center">
          <img id="refPreview" style="max-height:96px;display:none;border-radius:8px" alt="">
          <span id="refName" style="font-size:12px;color:#888"></span>
        </div>
        <label class="checkline">
          <input type="checkbox" id="inpaintOn">
          <span>局部重绘（涂抹区域重绘）</span>
        </label>
        <div id="inpaintBox" style="display:none">
          <canvas id="maskCanvas" style="max-width:100%;border:1px solid #555;border-radius:8px;display:none;touch-action:none;cursor:crosshair"></canvas>
          <div style="margin-top:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            <label style="font-size:12px">笔刷 <input id="brushSize" type="range" min="5" max="150" value="45" style="vertical-align:middle"></label>
            <button type="button" class="chip" id="eraserBtn">橡皮</button>
            <button type="button" class="chip" id="clearMask">清除</button>
            <label class="checkline" style="font-size:12px">
              <input type="checkbox" id="keepFace" checked>
              <span>锁定脸部</span>
            </label>
            <label class="checkline" style="font-size:12px">
              <input type="checkbox" id="poseLock" checked>
              <span>姿势锁定</span>
            </label>
            <label class="checkline" style="font-size:12px">
              <input type="checkbox" id="skinKeep" checked>
              <span>肤色保持</span>
            </label>
          </div>
          <p class="hint">涂抹要重绘的区域（衣服等）。姿势锁定用骨架约束姿势，肤色保持参考原图皮肤质感。</p>
        </div>
        <label style="margin-top:8px">重绘幅度 (denoise，越高越偏离原图)
          <input id="denoise" type="number" value="0.5" step="0.05" min="0.1" max="1">
        </label>
      </section>

      <section class="card">
        <h3>提示词</h3>
        <textarea id="prompt" rows="6" placeholder="正向提示词 (danbooru tags, 逗号分隔)"></textarea>
        <div id="triggers" class="triggers"></div>
        <button type="button" id="nlBtn" style="margin:6px 0;padding:4px 12px;border-radius:6px;border:1px solid #555;background:#2a2a44;color:#ddd;cursor:pointer">✍ 自然语言转Tag</button>
        <textarea id="negative" rows="3" placeholder="负向提示词"></textarea>
        <label class="checkline">
          <input type="checkbox" id="enhCompat">
          <span>Enhanced Compatibility</span>
        </label>
        <p class="hint">开启后使用经典参数组合（euler/normal, CFG 5, CLIP Skip 1）</p>
      </section>

      <section class="card">
        <h3>参数</h3>
        <div class="grid2">
          <label>Steps <input id="steps" type="number" value="28" min="1" max="150"></label>
          <label>CFG <input id="cfg" type="number" value="7" step="0.5" min="1" max="30"></label>
          <label>Sampler
            <select id="sampler">
              <option>euler</option><option>euler_ancestral</option>
              <option>dpmpp_2m</option><option>dpmpp_2m_sde</option>
              <option>dpmpp_3m_sde</option><option>dpmpp_sde</option>
              <option>ddim</option><option>unipc</option>
            </select>
          </label>
          <label>Scheduler
            <select id="scheduler">
              <option>normal</option><option>karras</option>
              <option>exponential</option><option>sgm_uniform</option>
            </select>
          </label>
          <label>宽 <input id="width" type="number" value="1024" step="64" min="512" max="2048"></label>
          <label>高 <input id="height" type="number" value="1536" step="64" min="512" max="2048"></label>
          <label class="seedline">Seed
            <input id="seed" type="number" value="-1">
            <button type="button" id="seedRandom" title="随机">🎲</button>
          </label>
          <label>张数 <input id="batch" type="number" value="1" min="1" max="8"></label>
        </div>
        <div class="presets">
          <button class="chip" data-w="1024" data-h="1024">1:1</button>
          <button class="chip" data-w="832" data-h="1216">2:3</button>
          <button class="chip" data-w="1024" data-h="1536">2:3 大</button>
          <button class="chip" data-w="1216" data-h="832">3:2</button>
        </div>
      </section>

      <button class="btn-primary" id="genBtn">生成</button>
      <div class="status" id="status"></div>
    </aside>

    <section class="results page-imgs">
      <div id="taskList" class="tasklist"></div>
      <div id="gallery" class="gallery"></div>
    </section>
  </main>
</div>

<!-- 大图查看 + 信息面板 -->
<div class="lightbox hidden" id="lightbox">
  <div class="lb-main">
    <div class="lb-stage" id="lbStage">
      <img id="lbImg" alt="">
    </div>
    <div class="lb-side" id="lbSide"></div>
  </div>
  <button class="lb-nav lb-prev" id="lbPrev">‹</button>
  <button class="lb-nav lb-next" id="lbNext">›</button>
  <div class="lb-info" id="lbInfo"></div>
  <button class="lb-close" id="lbClose">✕</button>
</div>

<!-- 收藏面板 -->
<div class="favpanel hidden" id="favPanel">
  <div class="fav-head">
    <span>⭐ 收藏夹</span>
    <button class="lb-close" id="favClose" style="position:static">✕</button>
  </div>
  <div id="favList" class="fav-list"></div>
</div>

<script src="/static/app.js?v=20260829e"></script>
</body>
</html>
