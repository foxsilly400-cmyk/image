<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鐢熸垚宸ヤ綔鍙?/title>
<link rel="stylesheet" href="/static/style.css?v=20260829b">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="logo">鈿?鐢熸垚宸ヤ綔鍙?/div>
    <div class="top-right">
      <button class="btn-ghost" id="luxBtn">鉁?璞í棰勮</button>
      <button class="btn-ghost" id="importBtn">馃摜 瀵煎叆妯″瀷</button>
      <button class="btn-ghost" id="favBtn">猸?鏀惰棌 (<span id="favCount">0</span>)</button>
      <div class="conn" id="conn">杩炴帴涓?..</div>
    </div>
  </header>

  <main class="layout">
    <div class="tabbar" id="tabbar">
      <button class="tab active" data-page="gen">鈿?鐢熸垚</button>
      <button class="tab" data-page="imgs">馃柤 鍥剧墖</button>
    </div>

    <aside class="panel page-gen active">
      <section class="card">
        <h3>妯″瀷</h3>
        <label>Checkpoint <select id="ckpt"></select></label>
        <label>LoRA</label>
        <div id="loraList"></div>
        <button class="btn-ghost" id="addLora">+ 娣诲姞 LoRA</button>
        <label>VAE <select id="vae"></select></label>
        <label>CLIP Skip
          <input id="clipSkip" type="number" min="1" max="4" value="1">
        </label>
      </section>

      <section class="card">
        <h3>img2img 鍙傝€冨浘</h3>
        <label class="checkline">
          <input type="checkbox" id="i2iOn">
          <span>浣跨敤鍙傝€冨浘閲嶇粯锛坕mg2img锛?/span>
        </label>
        <input type="file" id="refFile" accept="image/*" style="width:100%">
        <div style="margin-top:6px;display:flex;gap:8px;align-items:center">
          <img id="refPreview" style="max-height:96px;display:none;border-radius:8px" alt="">
          <span id="refName" style="font-size:12px;color:#888"></span>
        </div>
        <label style="margin-top:8px">閲嶇粯骞呭害 (denoise锛岃秺楂樿秺鍋忕鍘熷浘)
          <input id="denoise" type="number" value="0.5" step="0.05" min="0.1" max="1">
        </label>
      </section>

      <section class="card">
        <h3>鎻愮ず璇?/h3>
        <textarea id="prompt" rows="6" placeholder="姝ｅ悜鎻愮ず璇?(danbooru tags, 閫楀彿鍒嗛殧)"></textarea>
        <div id="triggers" class="triggers"></div>
        <button type="button" id="nlBtn" style="margin:6px 0;padding:4px 12px;border-radius:6px;border:1px solid #555;background:#2a2a44;color:#ddd;cursor:pointer">鉁?鑷劧璇█杞琓ag</button>
        <textarea id="negative" rows="3" placeholder="璐熷悜鎻愮ず璇?></textarea>
        <label class="checkline">
          <input type="checkbox" id="enhCompat">
          <span>Enhanced Compatibility</span>
        </label>
        <p class="hint">寮€鍚悗浣跨敤缁忓吀鍙傛暟缁勫悎锛坋uler/normal, CFG 5, CLIP Skip 1锛?/p>
      </section>

      <section class="card">
        <h3>鍙傛暟</h3>
        <div class="grid2">
          <label>Steps <input id="steps" type="number" value="24" min="1" max="150"></label>
          <label>CFG <input id="cfg" type="number" value="6" step="0.5" min="1" max="30"></label>
          <label>Sampler
            <select id="sampler">
              <option>euler</option><option>euler_ancestral</option>
              <option selected>dpmpp_2m</option><option>dpmpp_2m_sde</option>
              <option>dpmpp_3m_sde</option><option>dpmpp_sde</option>
              <option>ddim</option><option>unipc</option>
            </select>
          </label>
          <label>Scheduler
            <select id="scheduler">
              <option>normal</option><option selected>karras</option>
              <option>exponential</option><option>sgm_uniform</option>
            </select>
          </label>
          <label>瀹?<input id="width" type="number" value="1024" step="64" min="512" max="2048"></label>
          <label>楂?<input id="height" type="number" value="1536" step="64" min="512" max="2048"></label>
          <label class="seedline">Seed
            <input id="seed" type="number" value="-1">
            <button type="button" id="seedRandom" title="闅忔満">馃幉</button>
          </label>
          <label>寮犳暟 <input id="batch" type="number" value="1" min="1" max="8"></label>
        </div>
        <div class="presets">
          <button class="chip" data-w="1024" data-h="1024">1:1</button>
          <button class="chip" data-w="832" data-h="1216">2:3</button>
          <button class="chip" data-w="1024" data-h="1536">2:3 澶?/button>
          <button class="chip" data-w="1216" data-h="832">3:2</button>
        </div>
      </section>

      <button class="btn-primary" id="genBtn">鐢熸垚</button>
      <div class="status" id="status"></div>
    </aside>

    <section class="results page-imgs">
      <div id="taskList" class="tasklist"></div>
      <div id="gallery" class="gallery"></div>
    </section>
  </main>
</div>

<!-- 澶у浘鏌ョ湅 + 淇℃伅闈㈡澘 -->
<div class="lightbox hidden" id="lightbox">
  <div class="lb-main">
    <div class="lb-stage" id="lbStage">
      <img id="lbImg" alt="">
    </div>
    <div class="lb-side" id="lbSide"></div>
  </div>
  <button class="lb-nav lb-prev" id="lbPrev">鈥?/button>
  <button class="lb-nav lb-next" id="lbNext">鈥?/button>
  <div class="lb-info" id="lbInfo"></div>
  <button class="lb-close" id="lbClose">鉁?/button>
</div>

<!-- 鏀惰棌闈㈡澘 -->
<div class="favpanel hidden" id="favPanel">
  <div class="fav-head">
    <span>猸?鏀惰棌澶?/span>
    <button class="lb-close" id="favClose" style="position:static">鉁?/button>
  </div>
  <div id="favList" class="fav-list"></div>
</div>

<script src="/static/app.js?v=20260829b"></script>
</body>
</html>
